name: Deploy Dev (Merge PR -> Dev)

on:
  push:
    branches: ["dev"]

jobs:
  deploy-dev:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_RPRC_DEV_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Push migrations to Dev DB
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID
          supabase db push

      - name: Generate types
        run: supabase gen types types/database.ts --lang=typescript

      - name: Deploy to Vercel (Dev)
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel --prod=false --token $VERCEL_TOKEN
