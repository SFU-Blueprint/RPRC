name: Deploy Production (Merge dev -> main)

on:
  push:
    branches: ["main"]

jobs:
  deploy-prod:
    runs-on: ubuntu-latest

    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_RPRC_PROD_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN || '' }}

    steps:
      - uses: actions/checkout@v6

      - uses: supabase/setup-cli@v1

      - name: Push migrations to PROD DB
        run: |
          supabase link --project-ref $SUPABASE_PROJECT_ID --access-token $SUPABASE_ACCESS_TOKEN
          supabase db push

      - name: Generate types
        run: supabase gen types types/database.ts --lang=typescript

      - name: Deploy to Vercel (Prod)
        if: env.VERCEL_TOKEN != ''
        run: |
          npx vercel --prod --token $VERCEL_TOKEN
